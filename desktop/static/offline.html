<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Zipp Negocios</title>
<style>
  html, body { margin: 0; height: 100%; background: #14120F; color: #F3EDE3; font-family: system-ui, sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  p { margin: 0; color: #B9AF9E; font-size: 14px; max-width: 360px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #D69E26; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="dot"></div>
    <h1>Sin conexión con ZIPP</h1>
    <p>Reintentando. Esta ventana vuelve al panel sola en cuanto haya conexión — no hace falta hacer nada.</p>
  </div>
</body>
</html>
