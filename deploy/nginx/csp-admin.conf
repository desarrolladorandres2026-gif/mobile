# ZIPP · Nginx · Content-Security-Policy del panel administrativo (admin)
#
#   sudo cp deploy/nginx/csp-admin.conf /etc/nginx/snippets/zipp-csp-admin.conf
#   sudo sed -i 's/REEMPLAZAR_DOMINIO/tudominio.co/g' /etc/nginx/snippets/zipp-csp-admin.conf
#
# Se incluye SOLO en el server{} de panel.REEMPLAZAR_DOMINIO, y otra vez dentro de
# cada location que define su propio `add_header` (ver security-headers.conf para el
# porqué), debajo del include de seguridad. El panel de comercios tiene la suya
# (csp-business.conf); los orígenes son otros y no deben compartir política.
#
# ── Dónde está hoy (M-025) ───────────────────────────────────────────────────────
# El panel admin NO tenía ninguna CSP: lo que estaba en modo solo-informe era la de
# comercios. Esta arranca también en SOLO-INFORME (`Content-Security-Policy-Report-Only`)
# y manda cada infracción a `POST /api/v1/csp-report` (backend/src/routes/cspReport.routes.ts),
# que las agrupa por directiva y origen. Se leen en el panel: Seguridad → GET
# /api/v1/security/csp-violations (permiso security:view).
#
# ── Lo que SÍ está verificado ────────────────────────────────────────────────────
#  · index.html no tiene scripts en línea (el del tema salió a /theme-init.js).
#  · El código del panel no usa eval, new Function, innerHTML ni dangerouslySetInnerHTML,
#    y en el build del 2026-10-19 ninguno de los 122 archivos de dist/assets (con Mapbox,
#    Leaflet, Recharts y react-native-web dentro) contiene `eval(` ni `new Function(`;
#    dist/index.html solo carga scripts por `src`.
#  · Los orígenes externos que el código nombra (OpenStreetMap, Mapbox, Cloudinary, la
#    vista previa de Explorar) están en la política; hay una prueba que lo comprueba
#    (backend/src/__tests__/adminCsp.test.ts) y que falla si alguien añade un origen
#    al panel sin añadirlo aquí, o una directiva peligrosa a esta política.
#
# ── Lo que NO está verificado (pasos pendientes antes de pasar a bloqueo) ────────
# Nadie ha recorrido el panel en un navegador con el dominio real: el dominio sigue
# siendo REEMPLAZAR_DOMINIO. Una política que no se ha visto funcionar no se activa:
#   1. Desplegar así (solo-informe) y recorrer, con la consola abierta y una cuenta
#      con permisos amplios: login con 2FA, cierre y expiración de sesión, navegación
#      por cada ítem del menú, formularios (crear/editar comercio, cupón, tarifa,
#      regla tributaria), subida de flyer e imágenes, Zonas (Leaflet + dibujo),
#      Flota (Mapbox), vista previa de Explorar (iframe), documentos del domiciliario
#      (PDF en iframe), exportes CSV, sockets en vivo y las alertas con sonido.
#      Atención especial al expediente (dossier) del domiciliario en PDF: se abre en una
#      pestaña nueva desde una URL blob: que hereda esta política, y `object-src 'none'`
#      podría afectar al visor de PDF del navegador. No se ha podido comprobar.
#   2. Leer /security/csp-violations tras uno o dos días de uso real. Cada fila es un
#      recurso legítimo que faltaba en la política o algo que hay que corregir en el
#      panel. Nada se añade «para que deje de avisar»: se entiende primero.
#   3. Con cero infracciones legítimas, renombrar la cabecera a
#      `Content-Security-Policy` (misma línea, mismo contenido) y repetir el recorrido.
#      `frame-ancestors` solo cuenta en modo bloqueo; mientras tanto lo cubre X-Frame-Options.
#   4. Dejar `report-uri` también en bloqueo: es lo que avisa cuando un despliegue nuevo
#      rompe algo.
#
# ── Por qué cada directiva ───────────────────────────────────────────────────────
#  default-src 'none'  -> lo que no se nombra, no se permite. Más estricto que 'self'.
#  script-src 'self'   -> sin 'unsafe-inline' ni 'unsafe-eval'. Vite saca todo a archivos.
#  style-src 'self' 'unsafe-inline'
#                      -> EXCEPCIÓN DOCUMENTADA. react-native-web (lo usa la vista previa)
#                         inyecta una hoja <style> en el documento, y Leaflet/Mapbox/Recharts
#                         escriben estilos. Quitarla sin ver el panel en un navegador lo rompería.
#                         Se intenta endurecer (nonce o style-src-attr) después de ver los reportes.
#  img-src             -> fotos de Cloudinary (productos, flyers, logos), teselas de Leaflet
#                         (OpenStreetMap), sprites y teselas de Mapbox, y data:/blob: (vistas
#                         previas de imagen, iconos de Leaflet). NO `https:` en general: a
#                         diferencia del panel de comercios, aquí no se pegan URL libres.
#  connect-src         -> la API (https y wss), Mapbox (datos y telemetría que su licencia exige).
#  worker-src/child-src blob:
#                      -> Mapbox GL arranca sus workers desde un blob.
#  frame-src           -> la vista previa de Explorar (app.REEMPLAZAR_DOMINIO), y los PDF de
#                         documentos del domiciliario (URL firmada de Cloudinary).
#  media-src           -> la alarma se construye en memoria (blob:/data:).
#  font-src 'self' data:, manifest-src 'self'
#  object-src 'none', base-uri 'self', form-action 'self', frame-ancestors 'none'
#                      -> cierran los vectores clásicos (plugins, <base>, formularios hacia
#                         afuera, clickjacking).
#
# Reporting-Endpoints es el formato moderno (Chrome/Edge); report-uri lo entienden además
# Firefox y Safari. Se mandan los dos.
add_header Reporting-Endpoints 'csp="https://api.REEMPLAZAR_DOMINIO/api/v1/csp-report"' always;
add_header Content-Security-Policy-Report-Only "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com https://*.tile.openstreetmap.org https://api.mapbox.com; font-src 'self' data:; connect-src 'self' https://api.REEMPLAZAR_DOMINIO wss://api.REEMPLAZAR_DOMINIO https://api.mapbox.com https://events.mapbox.com; worker-src 'self' blob:; child-src blob:; media-src 'self' blob: data:; frame-src https://app.REEMPLAZAR_DOMINIO https://res.cloudinary.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri https://api.REEMPLAZAR_DOMINIO/api/v1/csp-report; report-to csp" always;
