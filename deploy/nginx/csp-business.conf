# ZIPP · Nginx · Content-Security-Policy del panel de comercios (business)
#
#   sudo cp deploy/nginx/csp-business.conf /etc/nginx/snippets/zipp-csp-business.conf
#   sudo sed -i 's/REEMPLAZAR_DOMINIO/tudominio.co/g' /etc/nginx/snippets/zipp-csp-business.conf
#
# Se incluye SOLO en el server{} de comercios.REEMPLAZAR_DOMINIO, y otra vez
# dentro de cada location que define su propio `add_header` (ver
# security-headers.conf para el porqué). admin y web tienen otros orígenes y
# no deben usar esta política sin revisarlos.
#
# ARRANCA EN MODO SOLO-INFORME (`Content-Security-Policy-Report-Only`): el
# navegador anota en la consola cada violación pero no bloquea nada. Pasos:
#   1. Desplegar así y recorrer el panel entero: pedidos, menú con foto,
#      Ajustes (mapa), publicidad, liquidaciones (descarga CSV), cierre de caja.
#   2. Si la consola no muestra violaciones, cambiar el nombre de la cabecera a
#      `Content-Security-Policy` para que bloquee.
#   3. En modo bloqueo, `frame-ancestors` ya cuenta; en solo-informe lo ignora
#      el navegador, y mientras tanto lo cubre X-Frame-Options.
#
# Las infracciones llegan a `POST /api/v1/csp-report` (se leen en
# GET /api/v1/security/csp-violations): sin eso, «recorrer el panel con la consola
# abierta» era la única fuente. Siguen siendo necesarios los pasos 1 a 3 de arriba en un
# navegador real; esto solo permite ver a diario lo que un recorrido no alcanza.
#
# Por qué cada directiva:
#  script-src 'self'    -> no hay scripts en línea ni evaluados (index.html no tiene).
#  style-src 'unsafe-inline' -> React y Leaflet escriben atributos style; sin esto
#                          se rompen el mapa y los anchos de las barras.
#  img-src https: data: blob: -> las fotos de producto y el flyer de publicidad
#                          vienen de URL https que pega el comercio; data/blob son
#                          las vistas previas del editor de imagen y los iconos de Leaflet.
#  connect-src           -> la API y el socket (mismo dominio, https y wss).
#  media-src blob: data: -> el sonido de la alarma se construye en memoria.
#  object-src 'none', base-uri 'self', form-action 'self' -> cierran vectores clásicos.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.REEMPLAZAR_DOMINIO wss://api.REEMPLAZAR_DOMINIO; media-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri https://api.REEMPLAZAR_DOMINIO/api/v1/csp-report; report-to csp" always;
add_header Reporting-Endpoints 'csp="https://api.REEMPLAZAR_DOMINIO/api/v1/csp-report"' always;
