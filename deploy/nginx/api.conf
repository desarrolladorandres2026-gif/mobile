# ZIPP · Nginx · API (Express + Socket.IO)  ->  api.REEMPLAZAR_DOMINIO
#
#   sudo cp deploy/nginx/api.conf /etc/nginx/sites-available/api.REEMPLAZAR_DOMINIO
#   sudo ln -s /etc/nginx/sites-available/api.REEMPLAZAR_DOMINIO /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.REEMPLAZAR_DOMINIO   # inyecta el bloque 443 + redirección
#
# Se define solo el :80. certbot añade el server{} de :443 con los
# certificados y el redirect 80->443. Así no hay rutas a certificados
# escritas a mano que apunten a archivos que aún no existen.

server {
    listen 80;
    listen [::]:80;
    server_name api.REEMPLAZAR_DOMINIO;

    # Cuerpo máximo: la subida más grande es una evidencia de entrega
    # (ORDER_EVIDENCE_MAX_BYTES = 5 MB) y una imagen de producto (8 MB).
    # 12M deja margen para el multipart sin permitir subidas absurdas.
    client_max_body_size 12M;

    # La app confía en X-Forwarded-* (app.set('trust proxy', 1)).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # ── WebSocket / Socket.IO ──
    # Ruta separada para poder darle timeouts largos: una conexión de
    # tracking está minutos abierta sin enviar bytes y con los 60s por
    # defecto Nginx la cortaría.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── API REST + /health ──
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 30s;
    }

    # /health sin logs de acceso: lo pega un cron cada minuto y solo
    # ensuciaría el log. Los errores sí se registran.
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }
}
