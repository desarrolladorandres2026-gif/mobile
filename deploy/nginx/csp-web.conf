# ZIPP · Nginx · Content-Security-Policy del sitio público (web)
#
#   sudo cp deploy/nginx/csp-web.conf /etc/nginx/snippets/zipp-csp-web.conf
#   sudo sed -i 's/REEMPLAZAR_DOMINIO/tudominio.co/g' /etc/nginx/snippets/zipp-csp-web.conf
#
# Se incluye SOLO en el server{} del apex y www (REEMPLAZAR_DOMINIO), y otra vez
# dentro de cada location que define su propio `add_header` (ver
# security-headers.conf para el porqué).
#
# Esta es la política más importante de ZIPP: el sitio guarda la sesión del
# cliente y, cuando exista el pago nativo, tokeniza tarjetas en el navegador.
# Un XSS aquí roba tokens o tarjetas. Por eso: nada en línea, ningún origen de
# scripts salvo los imprescindibles, y todo lo demás cerrado.
#
# ARRANCA EN MODO SOLO-INFORME (`Content-Security-Policy-Report-Only`) y NO DEBE SALIR ASÍ A
# PRODUCCIÓN ABIERTA: es la defensa que justifica guardar el refresh token en localStorage.
# Pasos:
#   1. Desplegar así y recorrer el sitio: inicio, comercios, ficha, cuenta,
#      pedido, pago y seguimiento, con la consola abierta.
#   2. Sin violaciones, renombrar la cabecera a `Content-Security-Policy`.
#   3. Las infracciones también llegan a POST /api/v1/csp-report.
#
# Por qué cada directiva:
#  script-src            -> 'self' más Google Identity (inicio de sesión) y Mapbox GL.
#                           Sin 'unsafe-inline' ni 'unsafe-eval'.
#  style-src 'unsafe-inline' -> React y Mapbox escriben atributos style.
#  img-src               -> Cloudinary (fotos), Mapbox (mosaicos), data/blob (mapa).
#  connect-src           -> la API y el socket, Mapbox (estilos, tiles vectoriales por fetch,
#                           eventos) y Google. Wompi NO aparece: el pago es una redirección
#                           de página completa, no una llamada desde el navegador.
#  frame-src             -> solo Google (botón de acceso). Wompi y los bancos tampoco: no se
#                           incrustan, se navega a ellos.
#  worker-src blob:      -> Mapbox GL arranca su worker desde un blob.
#  object-src 'none', base-uri 'self', form-action 'self' -> cierran vectores clásicos.
#
# Si algún día se tokeniza la tarjeta en el navegador (pago nativo), hay que añadir
# `connect-src https://production.wompi.co` (y sandbox solo en staging) y revisar esto otra vez.
add_header Reporting-Endpoints 'csp="https://api.REEMPLAZAR_DOMINIO/api/v1/csp-report"' always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://res.cloudinary.com https://api.mapbox.com https://*.tiles.mapbox.com https://lh3.googleusercontent.com; font-src 'self' data:; connect-src 'self' https://api.REEMPLAZAR_DOMINIO wss://api.REEMPLAZAR_DOMINIO https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com https://accounts.google.com; worker-src 'self' blob:; child-src blob:; frame-src https://accounts.google.com; media-src 'self' blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests; report-uri https://api.REEMPLAZAR_DOMINIO/api/v1/csp-report; report-to csp" always;
