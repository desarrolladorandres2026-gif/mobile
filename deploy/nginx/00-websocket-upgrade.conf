# ZIPP · Nginx · mapa para el upgrade a WebSocket
#
#   sudo cp deploy/nginx/00-websocket-upgrade.conf /etc/nginx/conf.d/
#
# Va en /etc/nginx/conf.d/ porque este bloque `map` tiene que vivir en
# el contexto `http {}`, no dentro de un `server {}`. Traduce la cabecera
# Connection: si el cliente pidió Upgrade (handshake de WebSocket) la
# reenvía como "upgrade"; si no, la deja vacía para permitir keep-alive.
#
# Sin esto, Socket.IO se queda en long-polling: funciona, pero con más
# latencia y más carga. El tracking en vivo de repartidores lo nota.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
