# ZIPP · Nginx · plantilla para un SPA estático (Vite)
#
# Cópiala UNA VEZ POR PANEL y sustituye los dos marcadores:
#
#   ┌─────────────┬──────────────────────────────┬───────────────────────┐
#   │ App         │ __SUBDOMINIO__                │ __RAIZ__              │
#   ├─────────────┼──────────────────────────────┼───────────────────────┤
#   │ admin       │ panel.REEMPLAZAR_DOMINIO     │ /var/www/zipp-admin   │
#   │ business    │ comercios.REEMPLAZAR_DOMINIO │ /var/www/zipp-business │
#   │ web/landing │ REEMPLAZAR_DOMINIO           │ /var/www/zipp-web     │
#   └─────────────┴──────────────────────────────┴───────────────────────┘
#
#   sed 's/__SUBDOMINIO__/panel.REEMPLAZAR_DOMINIO/; s#__RAIZ__#/var/www/zipp-admin#' \
#     deploy/nginx/spa.template.conf | sudo tee /etc/nginx/sites-available/panel.REEMPLAZAR_DOMINIO
#   sudo ln -s /etc/nginx/sites-available/panel.REEMPLAZAR_DOMINIO /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d panel.REEMPLAZAR_DOMINIO
#
# Para la landing añade también el apex + www:
#   sudo certbot --nginx -d REEMPLAZAR_DOMINIO -d www.REEMPLAZAR_DOMINIO
#
# Cabeceras de seguridad (clickjacking, nosniff, Referrer-Policy, HSTS): copia
# antes `security-headers.conf` a /etc/nginx/snippets/zipp-security-headers.conf.
# Los paneles de comercios y de administración añaden además su CSP
# (`csp-business.conf` y `csp-admin.conf`; ambas arrancan en modo solo-informe y las
# instrucciones para pasarlas a bloqueo están en cada archivo). Pega, según el panel:
#   include /etc/nginx/snippets/zipp-csp-business.conf;   # comercios.REEMPLAZAR_DOMINIO
#   include /etc/nginx/snippets/zipp-csp-admin.conf;      # panel.REEMPLAZAR_DOMINIO
# debajo de cada include de seguridad, en el server{} y en los tres location. El
# sitio público (web) usa `csp-web.conf` (include .../zipp-csp-web.conf) del mismo
# modo; arranca en solo-informe como las otras dos.
#
# Tras certbot, activa HTTP/2 en el bloque 443 igual que en api.conf
# (`http2 on;`, o `listen 443 ssl http2;` en nginx < 1.25.1).

server {
    listen 80;
    listen [::]:80;
    server_name __SUBDOMINIO__;

    root __RAIZ__;
    index index.html;

    include /etc/nginx/snippets/zipp-security-headers.conf;

    # Compresión de los bundles (Vite ya minifica; gzip recorta ~70% más).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los assets de Vite llevan hash en el nombre: si el archivo existe,
    # es inmutable y se puede cachear un año.
    # `^~`: gana a la regla de imágenes de abajo, que si no se quedaría con
    # los .png/.woff2 con hash y les daría una semana en vez de un año.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/zipp-security-headers.conf;
        try_files $uri =404;
    }

    # Imágenes y fuentes de `public/` (logo, fondos, íconos): no llevan hash
    # en el nombre, así que no pueden ser inmutables, pero tampoco tiene
    # sentido volver a pedirlas en cada visita. Una semana, y al cambiar un
    # archivo conviene cambiarle también el nombre.
    location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/zipp-security-headers.conf;
        try_files $uri =404;
    }

    # Solo en la web (apex): el sitemap lo genera el backend con los comercios
    # aprobados. Descomenta el bloque y pon el dominio real de la API.
    #
    # location = /sitemap.xml {
    #     proxy_pass https://api.REEMPLAZAR_DOMINIO/sitemap.xml;
    #     proxy_set_header Host api.REEMPLAZAR_DOMINIO;
    #     proxy_ssl_server_name on;
    #     add_header Cache-Control "public, max-age=600";
    # }

    # SPA fallback: cualquier ruta que no sea un archivo real devuelve
    # index.html y el router del cliente decide la pantalla. Sin esto,
    # recargar en /pedidos/123 daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea: es el que apunta a los assets con hash
    # nuevo tras cada deploy.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/zipp-security-headers.conf;
    }
}
