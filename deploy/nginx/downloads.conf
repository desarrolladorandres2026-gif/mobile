# ZIPP · Nginx · Descargas de Zipp Negocios  ->  descargas.REEMPLAZAR_DOMINIO
#
# El directorio (/var/www/zipp-downloads/negocios) lo crea provision.sh,
# igual que las raíces de los SPA — correr de nuevo ese script en un VPS ya
# aprovisionado es seguro, solo crea lo que falte.
#
#   sudo cp deploy/nginx/downloads.conf /etc/nginx/sites-available/descargas.REEMPLAZAR_DOMINIO
#   sudo ln -s /etc/nginx/sites-available/descargas.REEMPLAZAR_DOMINIO /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d descargas.REEMPLAZAR_DOMINIO
#
# Igual que api.conf: solo se define el :80, certbot añade el bloque 443
# con los certificados y el redirect. Después, activa HTTP/2 igual que ahí.
#
# Lo que publica aquí `desktop/scripts/release.mjs` (ver
# docs/ESCRITORIO-NEGOCIOS.md): el instalador (`.exe` + `.blockmap`), el
# `latest.yml` de electron-updater, y el manifiesto con la segunda firma
# (`release.json` + `release.json.sig`).
#
# Nada de SPA fallback: esto no es una app de una sola página, es una
# carpeta de archivos de descarga. Lo que no existe es un 404 llano.

server {
    listen 80;
    listen [::]:80;
    server_name descargas.REEMPLAZAR_DOMINIO;

    root /var/www/zipp-downloads/negocios;

    # Ningún visitante debe poder listar qué versiones hay publicadas, ni
    # husmear archivos sueltos de un release a medio subir.
    autoindex off;

    # El instalador y su blockmap llevan el número de versión en el
    # nombre: nunca cambian de contenido una vez publicados. Por eso son
    # los únicos `immutable` — `Zipp-Negocios-Setup.exe` (el alias
    # estable que enlaza la guía de instalación) SÍ cambia de contenido en
    # cada release, así que queda fuera de esta regla.
    location ~* ^/.+-\d+\.\d+\.\d+\.exe(\.blockmap)?$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # `latest.yml` y el manifiesto firmado son justo lo que electron-updater
    # y `updater.ts` comprueban en cada arranque: si un proxy intermedio los
    # cachea, un comercio puede tardar horas en enterarse de una versión
    # nueva, o peor, seguir viendo una vieja después de un rollback.
    location ~* ^/(latest\.yml|release\.json|release\.json\.sig)$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # El alias estable y cualquier otro archivo de descarga: una semana,
    # nunca inmutable (su contenido sí cambia).
    location / {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
