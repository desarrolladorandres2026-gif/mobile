# ZIPP · Nginx · cabeceras de seguridad comunes a los paneles (admin, business, web)
#
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/nginx/security-headers.conf /etc/nginx/snippets/zipp-security-headers.conf
#
# `spa.template.conf` la incluye en el server{} y otra vez dentro de cada
# location que define su propio `add_header`: nginx descarta TODOS los
# `add_header` heredados en cuanto un location define uno, así que sin
# repetir el include los assets y el index.html saldrían sin estas cabeceras.
#
# `always` hace que también salgan en respuestas 4xx/5xx.

# Nadie puede meter el panel en un iframe (clickjacking sobre "Aceptar",
# "Entrar como responsable" o el cierre de caja).
add_header X-Frame-Options "DENY" always;

# El navegador respeta el Content-Type que mandamos; no adivina que un
# archivo subido es un script.
add_header X-Content-Type-Options "nosniff" always;

# A otros sitios solo viaja el origen, no la ruta (que lleva ids de pedido).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# El panel no usa micrófono ni pagos del navegador. La ubicación solo la usa
# el mapa de Ajustes; la cámara, la foto del producto.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()" always;

# HTTPS obligatorio durante un año. Sin `includeSubDomains` ni `preload` a
# propósito: no se compromete a otros subdominios que aún no se han revisado.
# El navegador ignora esta cabecera sobre HTTP; solo cuenta en el bloque 443
# que certbot genera a partir de este server{}.
add_header Strict-Transport-Security "max-age=31536000" always;
